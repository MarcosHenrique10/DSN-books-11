<p class="nonindent"><span id="w490">Rolly</span>
<span id="w491">says,</span>
<span id="w492">&#x201C;Sorry</span>
<span id="w493">to</span>
<span id="w494">abandon</span>
<span id="w495">ship,</span>
<span id="w496">but</span>
<span id="w497">I&#x2019;ve</span>
<span id="w498">got</span>
<span id="w499">a</span>
<span id="w500">crab</span>
<span id="w501">to</span>
<span id="w502">catch!&#x201D;</span></p>
<p class="nonindent"><span id="w503">&#x201C;We</span>
<span id="w504">came</span>
<span id="w505">to</span>
<span id="w506">get</span>
<span id="w507">sand</span>
<span id="w508">for</span>
<span id="w509">Bob,</span>
<span id="w510">so</span>
<span id="w511">why</span>
<span id="w512">are</span>
<span id="w513">you</span>
<span id="w514">walking</span>
<span id="w515">away?&#x201D;</span>
<span id="w516">Bingo</span>
<span id="w517">asks.</span></p>
<p class="nonindent"><span id="w518">&#x201C;I&#x2019;m</span>
<span id="w519">not.</span>
<span id="w520">You</span>
<span id="w521">are!&#x201D;</span>
<span id="w522">Rolly</span>
<span id="w523">replies.</span></p>
<p class="nonindent"><span id="w524">But</span>
<span id="w525">neither</span>
<span id="w526">of</span>
<span id="w527">the</span>
<span id="w528">puppies</span>
<span id="w529">is</span>
<span id="w530">walking</span>
<span id="w531">anywhere.&#x00A0;.&#x00A0;.&#x00A0;.</span></p>
